[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model"
version = "0.1.0"
description = "A rigorous alternative model of reality: axioms, engine, Lean 4 core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Model contributors" }]

[project.scripts]
model = "cli:main"

[tool.setuptools]
py-modules = ["engine", "cli", "simulate", "validate_claims"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["tests.py"]
