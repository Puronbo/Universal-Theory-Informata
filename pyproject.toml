[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model"
version = "0.2.0"
description = "A rigorous alternative model of reality: axioms, engine, Lean 4 core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Grafiel S Puno and contributors" }]
keywords = ["model", "simulation", "ternary-logic", "cosmology", "lean4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.scripts]
model = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "matplotlib>=3.8",
    "bandit>=1.9.4",
    "pre-commit>=3.7",
]
docs = ["pdoc>=14"]

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*"]

[tool.setuptools.package-data]
model = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=model --cov-branch --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default args (intentional)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201", "N803", "N806"]
"model/impedance.py" = ["N803"]
"model/prized_problems.py" = ["N803"]
"model/self_looping.py" = ["N803"]
"model/rubber_ball.py" = ["N803"]
"cli.py" = ["T201"]
"simulate.py" = ["T201"]
"game_engine.py" = ["T201"]
"run_all.py" = ["T201"]
"validate_claims.py" = ["T201"]
"examples/*" = ["T201"]
"*.ipynb" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
ignore_missing_imports = false

[tool.coverage.run]
branch = true
source = ["model"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "examples", "lean", "docs"]
skips = ["B311", "B404", "B603"]