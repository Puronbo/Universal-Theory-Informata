name: Feature request
description: Propose a new module, test, or tooling improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Public API, module placement, and test plan.
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Epistemic status
      description: How should the new behavior be labelled?
      options:
        - grounded (tested + derived or measured)
        - candidate (formal sketch / calibration)
        - phenomenological (toy or illustrative)
        - tooling / docs (no physical claim)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
