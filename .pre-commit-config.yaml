repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: python -m mypy model cli.py
        language: system
        types: [python]
        pass_filenames: false
      - id: meta-audit
        name: meta-audit
        entry: python validate_claims.py
        language: system
        pass_filenames: false
